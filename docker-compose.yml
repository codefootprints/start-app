services:
  db:
    image: postgres:15-alpine
    container_name: start_postgres
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD:  password_rahasia
      POSTGRES_DB: start_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: